<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0809">
<meta name="description" content="a little place, made for one person 🌷">
<meta property="og:type" content="website">
<meta property="og:title" content="For Dira 🌹">
<meta property="og:description" content="a little place, made for one person 🌷">
<meta property="og:image" content="assets/img/paper.jpg">
<meta name="twitter:card" content="summary_large_image">
<title>For Dira 🌹</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%8C%B9%3C/text%3E%3C/svg%3E">

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/opening.css">
<link rel="stylesheet" href="css/photobooth.css">
<link rel="stylesheet" href="css/world.css">
<link rel="stylesheet" href="css/flower.css">
<link rel="stylesheet" href="css/story.css">
</head>
<body data-scene="opening">

  <!-- latar per-scene (di bawah kanvas), lalu lapisan sinematik -->
  <div id="bgFx" aria-hidden="true"></div>
  <div id="stageFx" aria-hidden="true"></div>

  <!-- debu / cahaya yang mengapung, digambar oleh js/dust.js -->
  <canvas id="dust" aria-hidden="true"></canvas>
  <!-- satu bunga untuk scene bunga & penutup, digambar oleh js/flower.js -->
  <canvas id="flowerCanvas" aria-hidden="true"></canvas>

  <!-- lagu latar (aset terpisah, bukan di dalam HTML) -->
  <audio id="song" loop preload="auto" src="assets/music/lagu.mp3"></audio>

  <!-- titik tahapan + ulangi -->
  <div id="topBar">
    <div id="sceneDots" aria-label="progress"></div>
    <button id="replayBtn" type="button" aria-label="Start again" title="Start again">⟲</button>
  </div>

  <main>

    <!-- ============ 01 — Opening / Digital Letter ============ -->
    <section class="scene scene--opening is-active" data-scene="opening" aria-label="Opening">
      <div class="scene-inner">
        <button class="seal-card" id="openLetter" type="button" aria-label="Open">
          <span class="seal-face">
            <span class="seal-heart" aria-hidden="true">♥</span>
          </span>
          <span class="seal-name"></span>
          <span class="seal-hint hint-pulse"></span>
        </button>

        <article class="letter-card" id="letterCard" tabindex="-1">
          <div class="letter-lines"></div>
          <button class="btn" id="letterNext" type="button">Come with me</button>
        </article>
      </div>
    </section>

    <!-- ============ 02 — Photobooth ============ -->
    <section class="scene scene--photobooth" data-scene="photobooth" aria-label="Photobooth">
      <div class="scene-inner scene-inner--top">
        <p class="kicker reveal"></p>
        <h1 class="title reveal" data-pb-title></h1>
        <p class="lede reveal" data-pb-hint></p>

        <div class="pb-wrap reveal">
          <div class="pb-frame" id="pbFrame" data-frame="paper">
            <div class="pb-stage">
              <video class="pb-video" playsinline autoplay muted></video>
              <img class="pb-still" alt="">
              <span class="pb-tint" aria-hidden="true"></span>
              <span class="pb-badge"><i></i>Live</span>
              <span class="pb-shotdots" aria-hidden="true"></span>
              <div class="pb-count" aria-hidden="true"></div>
              <div class="pb-flash" aria-hidden="true"></div>
              <p class="pb-pose"></p>
            </div>
            <p class="pb-frame-caption">Dira &amp; Oliq</p>
          </div>

          <div class="pb-controls">
            <div class="pb-row"><span data-pb-filter-label></span><div class="pb-chips" data-pb-filters></div></div>
            <div class="pb-row"><span data-pb-frame-label></span><div class="pb-chips" data-pb-frames></div></div>
            <div class="pb-actions">
              <button class="btn" type="button" data-pb-start>Start</button>
              <button class="btn btn--ghost" type="button" data-pb-pick>Or pick from gallery</button>
            </div>
            <p class="pb-status"></p>
          </div>

          <div class="pb-result" hidden>
            <img class="pb-strip" alt="photo strip">
            <div class="pb-actions">
              <a class="btn" href="#" data-pb-download>Save</a>
              <button class="btn btn--ghost" type="button" data-pb-share hidden>Share</button>
              <button class="btn btn--ghost" type="button" data-pb-retake>Again</button>
            </div>
            <div class="btn-row">
              <button class="btn btn--rose" type="button" data-pb-next>Go inside</button>
            </div>
          </div>
        </div>
      </div>
      <input class="pb-file" type="file" accept="image/*" multiple aria-hidden="true" tabindex="-1">
    </section>

    <!-- ============ 03 — Little World ============ -->
    <section class="scene scene--world" data-scene="world" aria-label="Little world">
      <div class="scene-inner">
        <p class="kicker reveal">our little world</p>
        <p class="lede reveal" data-world-hint></p>

        <div class="room reveal">
          <span class="room-floor" aria-hidden="true"></span>
          <span class="room-lamp" aria-hidden="true"></span>
          <span class="room-lights" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </span>
          <span class="room-curtain" aria-hidden="true"></span>
          <span class="room-window" aria-hidden="true"></span>
          <span class="room-rug" aria-hidden="true"></span>
          <button class="room-star" type="button" id="roomStar" aria-label="?">✦</button>
          <!-- tiga benda yang bisa ditap + karakter Dira dipasang oleh js/world.js -->
        </div>

        <button class="btn btn--ghost" type="button" data-world-next hidden>Keep going</button>
      </div>
    </section>

    <!-- ============ 04 — Interactive Flower ============ -->
    <section class="scene scene--flower" data-scene="flower" aria-label="Flower">
      <div class="flower-ui">
        <p class="flower-hint" id="flowerHint"></p>
        <div class="flower-lines" id="flowerLines"></div>
        <button class="btn btn--rose" type="button" id="flowerNext" hidden>Keep going</button>
      </div>
    </section>

    <!-- ============ 05 — Our Timeline ============ -->
    <section class="scene scene--timeline" data-scene="timeline" aria-label="Timeline">
      <div class="scene-inner scene-inner--top">
        <p class="kicker reveal">our timeline</p>
        <p class="lede reveal" data-timeline-hint></p>
        <div class="map reveal"></div>
        <button class="btn btn--ghost" type="button" data-timeline-next hidden>Keep going</button>
      </div>
    </section>

    <!-- ============ 06 — Mini games ============ -->
    <section class="scene scene--games" data-scene="games" aria-label="Mini games">
      <div class="scene-inner scene-inner--top">
        <div class="game-block" data-game="find">
          <h2 class="game-title"></h2>
          <p class="lede"></p>
          <div class="find-stage" id="findStage"></div>
          <p class="game-note" id="findNote"></p>
        </div>

        <div class="game-block" data-game="quiz" hidden>
          <h2 class="game-title"></h2>
          <p class="lede"></p>
          <div class="quiz">
            <h3 class="quiz-q"></h3>
            <div class="quiz-opts"></div>
            <p class="quiz-feedback" aria-live="polite"></p>
          </div>
          <p class="heart-count" id="heartCount"></p>
        </div>

        <button class="btn btn--ghost" type="button" data-games-next hidden>One more thing</button>
      </div>
    </section>

    <!-- ============ 07 — Little notes (pengganti voice message) ============ -->
    <section class="scene scene--voice" data-scene="voice" aria-label="Little notes">
      <div class="scene-inner">
        <h1 class="title reveal" data-voice-title></h1>
        <p class="lede reveal" data-voice-hint></p>
        <div class="note-list" aria-live="polite"></div>
        <button class="note-tap" type="button" data-note-tap aria-label="Next"></button>
        <button class="btn btn--ghost" type="button" data-voice-next hidden></button>
      </div>
    </section>

    <!-- ============ 08 — Final ============ -->
    <section class="scene scene--final" data-scene="final" aria-label="Final">
      <div class="scene-inner">
        <div class="final-stack">
          <div class="final-lines" id="finalLines"></div>
          <p class="final-love" id="finalLove"></p>
          <p class="final-sign" id="finalSign"></p>
          <button class="btn btn--rose" id="replayFinal" type="button">Start Again ♡</button>
        </div>
      </div>
    </section>

  </main>

  <!-- panel pesan dari bawah -->
  <div id="sheetScrim"></div>
  <div id="sheet" class="sheet" role="dialog" aria-label="note">
    <div class="sheet-card">
      <h3 class="sheet-title"></h3>
      <div class="sheet-body"></div>
      <div class="sheet-foot"></div>
    </div>
  </div>

  <!-- pesan rahasia -->
  <div id="egg" aria-hidden="true">
    <div class="egg-card">
      <p class="egg-title"></p>
      <div class="egg-lines"></div>
      <button class="btn btn--ghost" type="button" id="eggClose">Close</button>
    </div>
  </div>

  <div id="transition" aria-hidden="true"></div>
  <button id="musicToggle" type="button" aria-pressed="false">♫ Off</button>

  <noscript>
    <p style="position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:#0b0809;color:#f8ecdf;z-index:99">
      This needs JavaScript. Please enable it and reload 🌷
    </p>
  </noscript>

  <script src="js/content.js"></script>
  <script src="js/state.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/dust.js"></script>
  <script src="js/photobooth.js"></script>
  <script src="js/world.js"></script>
  <script src="js/flower.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/games.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
